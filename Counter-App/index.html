<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="counter-page">

        <section class="counter-card">

            <div class="card-top">
                <span class="app-label">JAVASCRIPT PROJECT</span>
                <span class="counter-icon">+</span>
            </div>

            <div class="counter-content">

                <p class="counter-label">CURRENT COUNT</p>

                <h1 id="count">0</h1>

                <p id="status" class="status">Counter is at zero</p>

            </div>

            <div class="controls">

                <button id="decrease" class="control-btn decrease">
                    <span>−</span>
                    Decrease
                </button>

                <button id="reset" class="control-btn reset">
                    <span>↻</span>
                    Reset
                </button>

                <button id="increase" class="control-btn increase">
                    <span>+</span>
                    Increase
                </button>

            </div>

            <div class="card-footer">
                <span>Simple</span>
                <span class="dot"></span>
                <span>Fast</span>
                <span class="dot"></span>
                <span>Interactive</span>
            </div>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
